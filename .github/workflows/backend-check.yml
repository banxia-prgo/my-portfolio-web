name: Backend checks

on:
  pull_request:
    branches:
      - vue-migration
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  push:
    branches:
      - vue-migration
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banxia
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: banxia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banxia -d banxia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://banxia:test-password@localhost:5432/banxia_test
      SECRET_KEY: ci-only-secret-key-for-backend-checks
      ADMIN_EMAILS: admin@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify API schema loads
        run: python -c "from sqlalchemy.orm import configure_mappers; from app.main import app; configure_mappers(); schema = app.openapi(); assert app.title == '半夏小筑 API'; assert '/api/admin/content' in schema['paths']; assert '/api/content/{kind}/{slug}' in schema['paths']; print('API schema and ORM mappings OK')"
